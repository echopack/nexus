<!doctype html>
<html>
<body style="font-family: sans-serif; line-height: 1.5;">
  <h1>Hello {{ name }}</h1>
  <p>Welcome to {{ blog }}. Your account is ready, and you can sign in with the address this mail went to.</p>
  {{ if posts }}
  <h2>The latest posts</h2>
  <ul>
    {{ each posts as post }}
    <li><a href="{{ post.url }}">{{ post.title }}</a></li>
    {{ end }}
  </ul>
  {{ end }}
  <p>See you soon.</p>
</body>
</html>
