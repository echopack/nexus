<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>A nexus blog</title>
<link rel="preconnect" href="https://api.fontshare.com">
<link rel="preconnect" href="https://cdn.fontshare.com" crossorigin>
<link href="https://api.fontshare.com/v2/css?f[]=sentient@300,400,500&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    theme: {
      extend: {
        colors: { paper: '#f7f9f8', surface: '#ebf0ee', ink: '#06525c', muted: '#2f737d', pale: '#93c3c8', alarm: '#8c2a1c' },
        fontFamily: { serif: ['Sentient', 'Georgia', 'serif'] },
      },
    },
  };
</script>
<style>
  :root {
    --m: clamp(16px, 3vw, 48px);
    --gap: clamp(96px, 12vw, 200px);
    --step-small: clamp(0.8125rem, 0.79rem + 0.1vw, 0.875rem);
    --step-body: clamp(1.125rem, 1.05rem + 0.3vw, 1.3125rem);
    --step-lead: clamp(1.25rem, 1.1rem + 0.7vw, 1.625rem);
    --step-head: clamp(2rem, 1.3rem + 3.2vw, 4rem);
    --cap: 14vw;
    --measure: 55vw;
    --out: cubic-bezier(.16, 1, .3, 1);
  }
  @media (max-width: 1023px) { :root { --cap: 19vw; --measure: calc(100vw - 2 * var(--m)); } }
  @media (max-width: 640px) { :root { --cap: 21vw; } }

  /* a line sized so its longest line (--chars) fills the measure, or a page title kept to two lines */
  .fit { font-size: min(var(--cap), calc(var(--measure) / (var(--chars) * 0.4))); }
  .fit2 { font-size: clamp(2rem, calc(2 * (100vw - 2 * var(--m)) / (var(--chars) * 0.56)), 7.5vw); text-wrap: balance; }

  .line { display: block; overflow: hidden; padding-bottom: 0.06em; }
  .line > span { display: block; animation: rise 1.1s var(--out) both; animation-delay: calc(var(--i, 0) * 90ms); }
  .arrive { animation: arrive .9s var(--out) both; animation-delay: calc(300ms + var(--i, 0) * 80ms); }
  .reveal { opacity: 0; transform: translateY(24px); transition: opacity .8s var(--out), transform .8s var(--out); transition-delay: calc(var(--i, 0) * 60ms); }
  .reveal.in { opacity: 1; transform: none; }
  .mark { transform: translateY(55%); transition: transform 1.4s var(--out); }
  .mark.in { transform: translateY(30%); }
  @keyframes rise { from { transform: translateY(105%); } }
  @keyframes arrive { from { opacity: 0; transform: translateY(20px); } }

  @media (prefers-reduced-motion: reduce) {
    .line > span, .arrive { animation: none; }
    .reveal, .reveal.in, .mark { opacity: 1; transform: none; transition: none; }
    .mark, .mark.in { transform: translateY(30%); }
  }
</style>
</head>
<body class="bg-paper font-serif text-ink antialiased [font-size:var(--step-body)] leading-[1.55]">
<header id="bar" class="absolute inset-x-0 top-0 z-10 flex items-center justify-between gap-6 px-[var(--m)] py-5 [font-size:var(--step-small)]">
  <a href="#/" id="wordmark" class="font-medium hover:underline underline-offset-4">A nexus blog</a>
  <nav id="nav" class="flex items-center gap-5"></nav>
</header>
<main id="view"></main>
<footer id="close" class="hidden"></footer>
<div id="notice" role="alert" class="fixed inset-x-[var(--m)] bottom-[var(--m)] z-20 hidden max-w-xl bg-alarm px-5 py-4 text-paper [font-size:var(--step-small)]"></div>

<script>
// the blog in a browser: hash routes over the JSON API, every call signed with a session kept in
// localStorage; the page opens one before its first call, signing in puts the user on it
const $ = (sel) => document.querySelector(sel);
const view = $('#view');
const blog = { title: 'A nexus blog' };
let me = null;

function el(tag, attrs = {}, ...children) {
  const n = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k === 'class') n.className = v;
    else if (k === 'style') n.style.cssText = v;
    else if (k.startsWith('on')) n.addEventListener(k.slice(2), v);
    else n.setAttribute(k, v);
  }
  for (const c of children.flat()) {
    if (c != null && c !== false) n.append(c);
  }
  return n;
}

const store = {
  get session() { try { return JSON.parse(localStorage.getItem('blog.session')); } catch { return null; } },
  set session(v) { try { v ? localStorage.setItem('blog.session', JSON.stringify(v)) : localStorage.removeItem('blog.session'); } catch {} },
};

// one session at a time, however many calls ask for it at once
let opening = null;
function session() {
  const kept = store.session;
  if (kept) return Promise.resolve(kept);
  opening ??= fetch('/v1/auth/session', { method: 'POST', headers: { Accept: 'application/json' } })
    .then(async (res) => {
      if (!res.ok) throw (await res.json().catch(() => null)) ?? { title: `${res.status} ${res.statusText}` };
      const { id, secret } = await res.json();
      store.session = { id, secret };
      return store.session;
    })
    .finally(() => { opening = null; });
  return opening;
}

const hex = (buf) => [...new Uint8Array(buf)].map((b) => b.toString(16).padStart(2, '0')).join('');
const utf8 = (text) => new TextEncoder().encode(text);

// Authorization: Nexus-Sig over METHOD, target, unix time and the body's sha256, one per line
async function sign(s, method, target, body) {
  const ts = Math.floor(Date.now() / 1000);
  const digest = hex(await crypto.subtle.digest('SHA-256', utf8(body)));
  const key = await crypto.subtle.importKey('raw', utf8(s.secret), { name: 'HMAC', hash: 'SHA-256' }, false, ['sign']);
  const sig = hex(await crypto.subtle.sign('HMAC', key, utf8(`${method}\n${target}\n${ts}\n${digest}`)));
  return `Nexus-Sig id=${s.id},ts=${ts},sig=${sig}`;
}

async function send(method, path, text) {
  const headers = { Accept: 'application/json' };
  if (text !== undefined) headers['Content-Type'] = 'application/json';
  headers.Authorization = await sign(await session(), method, path, text ?? '');
  return fetch(path, { method, headers, body: text });
}

async function api(method, path, body, retried = false) {
  const text = body === undefined ? undefined : JSON.stringify(body);
  const res = await send(method, path, text);
  const data = res.status === 204 ? null : await res.json().catch(() => null);
  if (!res.ok) {
    // a 401 is either nobody signed in or a session that ended: only the second needs a new one
    if (res.status === 401 && !retried && data?.reason === 'session_ended') {
      store.session = null;
      if (me) { me = null; renderNav(); }
      if (method === 'GET') return api(method, path, body, true);
    }
    throw data ?? { title: `${res.status} ${res.statusText}` };
  }
  return data;
}

function notice(problem) {
  const box = $('#notice');
  if (!problem) { box.classList.add('hidden'); box.replaceChildren(); return; }
  const said = problem.detail ?? problem.title ?? 'Something went wrong.';
  const fields = (problem.errors ?? []).map((e) => el('li', {}, e.message));
  box.replaceChildren(el('div', {},
    el('p', { class: 'font-medium' }, said.charAt(0).toUpperCase() + said.slice(1)),
    fields.length ? el('ul', { class: 'mt-1 list-disc pl-5' }, fields) : null,
  ));
  box.classList.remove('hidden');
}

// buttons and links, one shape for the page: square, filled, 44px tall
const button = (onField) => `inline-flex min-h-[44px] items-center px-6 font-medium transition-[transform,background-color] duration-200 active:scale-[0.97] disabled:opacity-50 ${onField ? 'bg-paper text-ink hover:bg-surface' : 'bg-ink text-paper hover:bg-muted'}`;
const link = 'underline-offset-4 decoration-1 hover:underline';
const field = 'w-full bg-surface px-4 py-3 text-ink outline-none transition-colors placeholder:text-muted/60 focus:bg-[#dfe8e5] focus-visible:ring-2 focus-visible:ring-ink';

const date = (s) => s ? new Date(s).toLocaleDateString('en-GB', { year: 'numeric', month: 'short', day: 'numeric' }) : '';
const tagText = (list) => (list ?? []).join(', ');

// the title in two lines of about the same length
function twoLines(text) {
  const words = text.split(/\s+/).filter(Boolean);
  let best = [text, ''];
  let worst = Infinity;
  for (let i = 1; i < words.length; i++) {
    const a = words.slice(0, i).join(' ');
    const b = words.slice(i).join(' ');
    if (Math.max(a.length, b.length) < worst) { worst = Math.max(a.length, b.length); best = [a, b]; }
  }
  return best.filter(Boolean);
}

function revealAll(root = document) {
  const items = root.querySelectorAll('.reveal, .mark');
  if (!('IntersectionObserver' in window)) { items.forEach((n) => n.classList.add('in')); return; }
  const io = new IntersectionObserver((entries) => {
    for (const e of entries) if (e.isIntersecting) { e.target.classList.add('in'); io.unobserve(e.target); }
  }, { rootMargin: '0px 0px -8% 0px' });
  items.forEach((n) => io.observe(n));
}

function renderNav() {
  const nav = $('#nav');
  const onField = $('#bar').dataset.on === 'field';
  if (me) {
    nav.replaceChildren(
      el('span', { class: 'hidden sm:inline opacity-80' }, me.name ?? me.email ?? ''),
      el('button', { class: link, onclick: signOut }, 'Sign out'),
      el('a', { href: '#/new', class: button(onField) }, 'Write'),
    );
  } else {
    const here = location.hash;
    nav.replaceChildren(...[
      here !== '#/signup' && el('a', { href: '#/signup', class: link }, 'Sign up'),
      here !== '#/login' && el('a', { href: '#/login', class: button(onField) }, 'Sign in'),
    ].filter(Boolean));
  }
}

function frame(onField, withClose) {
  const bar = $('#bar');
  bar.dataset.on = onField ? 'field' : 'paper';
  bar.classList.toggle('text-paper', onField);
  $('#wordmark').textContent = blog.title;
  renderNav();
  const close = $('#close');
  close.classList.toggle('hidden', !withClose);
  if (withClose) renderClose();
}

async function signOut() {
  try { await api('DELETE', '/v1/auth'); } catch {}
  store.session = null;
  me = null;
  location.hash = '#/';
  route();
}

async function listView(page) {
  const res = await api('GET', `/v1/posts?page=${page}`);
  const posts = res.data ?? [];
  const latest = page === 1 ? posts[0] : null;
  frame(true, true);

  const lines = twoLines(blog.title);
  const chars = Math.max(...lines.map((l) => l.length));
  // the name on the left, the newest post on the right
  const excerpt = (s) => s.length > 220 ? `${s.slice(0, 220).replace(/\s+\S*$/, '')}…` : s;
  const hero = el('section', { class: 'grid gap-x-6 gap-y-16 bg-ink px-[var(--m)] pb-[clamp(56px,8vw,120px)] pt-[clamp(112px,18svh,200px)] text-paper lg:grid-cols-12' },
    el('div', { class: 'lg:col-span-7' },
      el('h1', { class: 'fit font-light leading-[0.86] tracking-[-0.03em]', style: `--chars:${chars}` },
        lines.map((l, i) => el('span', { class: 'line' }, el('span', { class: i === 0 && lines.length > 1 ? 'text-pale' : '', style: `--i:${i}` }, l)))),
      el('p', { class: 'arrive mt-10 max-w-[34ch] [font-size:var(--step-lead)] leading-snug', style: '--i:0' },
        'Short posts, newest first. Anyone reads; sign up to write.'),
    ),
    el('div', { class: 'flex flex-col items-start gap-8 lg:col-span-4 lg:col-start-9 lg:self-end' },
      latest
        ? el('a', { href: `#/posts/${latest.id}`, class: 'arrive group block', style: '--i:1' },
            el('span', { class: 'block [font-size:var(--step-small)] text-pale' }, `Latest, ${date(latest.created_at)}`),
            el('span', { class: `mt-2 block [font-size:var(--step-lead)] leading-snug ${link} group-hover:underline` }, latest.title),
            el('span', { class: 'mt-3 block leading-[1.55]' }, excerpt(latest.body)))
        : null,
      el('button', { class: `arrive ${button(true)}`, style: '--i:2', onclick: () => $('#posts').scrollIntoView({ behavior: 'smooth' }) }, 'All posts'),
    ),
  );

  const rows = posts.map((p, i) => el('li', { class: 'reveal', style: `--i:${i % 10}` },
    el('a', { href: `#/posts/${p.id}`, class: 'group -mx-3 grid grid-cols-[1fr_auto] gap-x-6 px-3 py-[0.45em] transition-colors hover:bg-surface lg:grid-cols-12' },
      el('span', { class: 'col-span-2 transition-transform duration-300 group-hover:translate-x-1.5 lg:col-span-7' }, p.title),
      el('span', { class: 'text-muted [font-size:var(--step-small)] lg:col-span-3 lg:[font-size:inherit]' }, tagText(p.tags)),
      el('span', { class: 'whitespace-nowrap text-right tabular-nums text-muted [font-size:var(--step-small)] lg:col-span-2 lg:text-ink lg:[font-size:inherit]' }, date(p.created_at)),
    )));
  const list = el('section', { id: 'posts', class: 'scroll-mt-6 px-[var(--m)] pb-[clamp(64px,8vw,120px)] pt-[var(--gap)] [font-size:var(--step-lead)] leading-snug' },
    el('h2', { class: 'reveal mb-6 text-muted' }, page > 1 ? `Posts, page ${page}` : 'Posts, newest first'),
    rows.length
      ? el('ol', {}, rows)
      : el('p', { class: 'reveal' }, page > 1 ? 'No older posts.' : 'Nothing here yet. ',
          page > 1 ? null : el('a', { href: me ? '#/new' : '#/signup', class: 'underline underline-offset-4' }, 'Write the first one.')),
    el('div', { class: 'reveal mt-12 flex justify-between' },
      page > 1 ? el('a', { href: `#/?page=${page - 1}`, class: link }, '← Newer') : el('span'),
      posts.length >= (res.size ?? 10) ? el('a', { href: `#/?page=${page + 1}`, class: link }, 'Older →') : el('span'),
    ),
  );
  view.replaceChildren(hero, list);
  if (page > 1) list.scrollIntoView();
}

async function postView(id) {
  const p = (await api('GET', `/v1/posts/${encodeURIComponent(id)}?include=author`)).data;
  frame(false, true);
  document.title = `${p.title} · ${blog.title}`;
  const aside = (label, value) => value ? el('div', { class: 'reveal' },
    el('dt', { class: 'text-muted' }, label), el('dd', { class: 'mb-5' }, value)) : null;
  view.replaceChildren(el('article', { class: 'px-[var(--m)] pb-[var(--gap)] pt-[clamp(120px,16vw,220px)]' },
    el('h1', { class: 'fit2 arrive font-light leading-[1.0] tracking-[-0.02em]', style: `--chars:${p.title.length};--i:0` }, p.title),
    el('div', { class: 'mt-[clamp(48px,6vw,96px)] grid gap-12 md:grid-cols-12' },
      el('div', { class: 'reveal max-w-[65ch] whitespace-pre-wrap leading-[1.6] md:col-span-7' }, p.body),
      el('dl', { class: 'md:col-span-3 md:col-start-10 [font-size:var(--step-small)]' },
        aside('Written by', p.author?.name),
        aside('On', date(p.created_at)),
        aside('Tagged', tagText(p.tags)),
        el('a', { href: '#/', class: `reveal inline-block ${link}` }, '← All posts'),
      ),
    ),
  ));
}

function form(fields, label, onsubmit) {
  const submit = el('button', { type: 'submit', class: button(false) }, label);
  const f = el('form', { class: 'space-y-6' }, fields, el('div', { class: 'pt-2' }, submit));
  f.addEventListener('submit', async (e) => {
    e.preventDefault();
    notice(null);
    submit.disabled = true;
    try { await onsubmit(new FormData(f)); } catch (p) { notice(p); } finally { submit.disabled = false; }
  });
  return f;
}

const labelled = (text, control) => el('label', { class: 'block space-y-2' },
  el('span', { class: 'block [font-size:var(--step-small)] text-muted' }, text), control);

function sheet(title, intro, body) {
  return el('section', { class: 'grid min-h-[100svh] gap-12 px-[var(--m)] pb-[var(--gap)] pt-[clamp(120px,16vw,220px)] md:grid-cols-12' },
    el('div', { class: 'md:col-span-5' },
      el('h1', { class: 'arrive font-light leading-[1.0] tracking-[-0.02em] [font-size:var(--step-head)]', style: '--i:0' }, title),
      el('p', { class: 'arrive mt-8 max-w-[32ch] text-muted', style: '--i:1' }, intro)),
    el('div', { class: 'arrive md:col-span-6 md:col-start-7', style: '--i:2' }, body),
  );
}

async function signIn(email, password) {
  me = (await api('POST', '/v1/auth/signin', { email, password })).data;
  location.hash = '#/new';
}

function loginView() {
  frame(false, false);
  view.replaceChildren(sheet('Sign in to write.',
    ['Reading needs no account. New here? ', el('a', { href: '#/signup', class: 'underline underline-offset-4' }, 'Sign up.')],
    form([
      labelled('E-mail', el('input', { name: 'email', type: 'email', required: '', autocomplete: 'email', class: field })),
      labelled('Password', el('input', { name: 'password', type: 'password', required: '', autocomplete: 'current-password', class: field })),
    ], 'Sign in', (d) => signIn(d.get('email'), d.get('password')))));
}

function signupView() {
  frame(false, false);
  view.replaceChildren(sheet('Sign up to write.',
    ['Your name goes on every post you publish. Have an account? ', el('a', { href: '#/login', class: 'underline underline-offset-4' }, 'Sign in.')],
    form([
      labelled('Name', el('input', { name: 'name', required: '', autocomplete: 'name', class: field })),
      labelled('E-mail', el('input', { name: 'email', type: 'email', required: '', autocomplete: 'email', class: field })),
      labelled('Password', el('input', { name: 'password', type: 'password', required: '', autocomplete: 'new-password', class: field })),
      labelled('Password, once more', el('input', { name: 'passwordConfirmation', type: 'password', required: '', autocomplete: 'new-password', class: field })),
    ], 'Sign up', async (d) => {
      const email = String(d.get('email')).trim().toLowerCase();
      await api('POST', '/v1/users', { name: d.get('name'), email, password: d.get('password'), passwordConfirmation: d.get('passwordConfirmation') });
      await signIn(email, d.get('password'));
    })));
}

function newView() {
  if (!me) { location.hash = '#/login'; return; }
  frame(false, false);
  view.replaceChildren(sheet('Write a post.', 'It goes live as soon as you publish, signed with your name.', form([
    labelled('Title', el('input', { name: 'title', required: '', maxlength: '120', class: `${field} font-light [font-size:var(--step-lead)]` })),
    labelled('Body', el('textarea', { name: 'body', rows: '12', required: '', class: `${field} leading-[1.6]` })),
    labelled('Tags, separated by commas', el('input', { name: 'tags', placeholder: 'echo, nexus', class: field })),
  ], 'Publish', async (d) => {
    const tags = String(d.get('tags')).split(',').map((t) => t.trim()).filter(Boolean);
    const created = await api('POST', '/v1/posts', { title: d.get('title'), body: d.get('body'), tags });
    location.hash = `#/posts/${created.data.id}`;
  })));
}

function renderClose() {
  $('#close').className = 'relative flex flex-col overflow-hidden bg-ink px-[var(--m)] pt-[clamp(72px,10vw,160px)] text-paper';
  $('#close').replaceChildren(
    el('div', { class: 'grid gap-10 md:grid-cols-12' },
      el('div', { class: 'md:col-span-7' },
        el('h2', { class: 'reveal font-light leading-[1.0] tracking-[-0.02em] [font-size:var(--step-head)]' }, 'Write the next one.'),
        el('a', { href: me ? '#/new' : '#/signup', class: `reveal mt-8 ${button(true)}`, style: '--i:1' }, me ? 'Write a post' : 'Sign up to write')),
      el('ul', { class: 'reveal space-y-2 md:col-span-3 md:col-start-10', style: '--i:2' },
        el('li', {}, el('a', { href: '#/', class: link }, 'All posts')),
        el('li', {}, el('a', { href: '/v1/posts', class: link }, 'Posts as JSON')),
        el('li', {}, el('a', { href: '/health', class: link }, 'Health')),
      ),
    ),
    el('div', { class: 'mt-auto flex justify-between gap-6 pt-[clamp(64px,8vw,120px)] [font-size:var(--step-small)] text-pale' },
      el('span', {}, 'Served by nexus, written in Echo.'),
      el('span', {}, String(new Date().getFullYear()))),
    el('div', { 'aria-hidden': 'true', class: 'mark -mb-[0.1em] whitespace-nowrap font-light leading-[0.8] tracking-[-0.04em] text-pale [font-size:28vw]' }, blog.title),
  );
}

async function loadMe() {
  me = null;
  try { me = (await api('GET', '/v1/auth/session')).data; } catch {}
}

async function route() {
  notice(null);
  document.title = blog.title;
  const [path, query] = location.hash.replace(/^#/, '').split('?');
  window.scrollTo(0, 0);
  try {
    const post = path.match(/^\/posts\/([^/]+)$/);
    if (post) await postView(post[1]);
    else if (path === '/login') loginView();
    else if (path === '/signup') signupView();
    else if (path === '/new') newView();
    else await listView(Math.max(1, Number(new URLSearchParams(query).get('page')) || 1));
  } catch (p) {
    frame(false, false);
    view.replaceChildren(el('section', { class: 'px-[var(--m)] pt-[clamp(120px,16vw,220px)] pb-[var(--gap)]' },
      el('h1', { class: 'font-light leading-[1.0] tracking-[-0.02em] [font-size:var(--step-head)]' }, p?.status === 404 ? 'Not here.' : 'That went wrong.'),
      el('a', { href: '#/', class: `mt-8 inline-block ${link}` }, '← All posts')));
    notice(p);
  }
  revealAll();
}

window.addEventListener('hashchange', route);
Promise.all([
  api('GET', '/health').then((h) => { if (h.title) blog.title = h.title; }).catch(() => {}),
  loadMe(),
]).then(route);
</script>
</body>
</html>
